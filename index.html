<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Godot RPG</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
    <script>
        const CURRENT_APP_VERSION = "1.0.1"; // <-- UBAH VERSI INI SAAT MELAKUKAN DEPLOY BARU
        const VERSION_STORAGE_KEY = "godot_rpg_app_version";

        function checkAndBustCache() {
            const storedVersion = localStorage.getItem(VERSION_STORAGE_KEY);

            if (storedVersion !== CURRENT_APP_VERSION) {
                console.log(`App version changed from ${storedVersion} to ${CURRENT_APP_VERSION}. Forcing cache bust.`);

                // Hapus semua Service Workers
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for (let registration of registrations) {
                            registration.unregister().then(function(success) {
                                if (success) {
                                    console.log('Service Worker unregistered successfully.');
                                } else {
                                    console.log('Service Worker unregistration failed.');
                                }
                            }).catch(function(error) {
                                console.error('Error unregistering service worker:', error);
                            });
                        }
                    });
                }

                // Hapus semua Cache Storage
                if ('caches' in window) {
                    caches.keys().then(function(cacheNames) {
                        return Promise.all(
                            cacheNames.map(function(cacheName) {
                                console.log('Deleting cache:', cacheName);
                                return caches.delete(cacheName);
                            })
                        );
                    }).then(function() {
                        console.log('All caches cleared.');
                    }).catch(function(error) {
                        console.error('Error clearing caches:', error);
                    });
                }

                localStorage.setItem(VERSION_STORAGE_KEY, CURRENT_APP_VERSION);
                console.log('Reloading page to apply new version...');
                // Memuat ulang halaman tanpa menggunakan cache (paksa refresh)
                window.location.reload(true);
            } else {
                console.log(`App version ${CURRENT_APP_VERSION} is current. No cache bust needed.`);
            }
        }

        // Jalankan pengecekan cache segera setelah DOM dimuat
        document.addEventListener('DOMContentLoaded', checkAndBustCache);
    </script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="module" src="index.js"></script>
</body>
</html>
